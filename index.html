<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>インテック式適性診断｜回答入力</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#162840;background:#f2f6fb}
    *{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:28px 18px 80px}
    h1{font-size:clamp(24px,5vw,34px);margin:0 0 8px}h2{font-size:20px;margin:0 0 20px}
    p{line-height:1.7}.lead{margin:0 0 24px;color:#41536a}
    .panel,.question{background:white;border:1px solid #dce5f0;border-radius:15px;padding:22px;margin:0 0 16px;box-shadow:0 3px 12px #233e6010}
    label{display:block;font-weight:700;margin-bottom:7px}.field{margin:0 0 16px}.field:last-child{margin:0}
    input,select{font:inherit;width:100%;min-height:48px;border:1px solid #aab9cc;border-radius:8px;background:white;color:#162840;padding:10px 12px}
    input:focus,select:focus,button:focus-visible{outline:3px solid #53afe9;outline-offset:2px}
    .question label{line-height:1.6}.num{display:inline-block;background:#e5f4fb;color:#096b96;border-radius:6px;padding:2px 10px;margin-right:8px}
    .question select{margin-top:8px}.hint{font-size:14px;color:#5e6d7f;margin:0 0 18px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:9px;padding:14px 24px;font:inherit;font-weight:700;cursor:pointer}
    .primary{background:#08779c;color:white}.secondary{background:#e3ebf3;color:#17344a}
    #message{min-height:1.8em;margin:12px 0;color:#b43636;font-weight:700}
    #resultPanel[hidden]{display:none}textarea{width:100%;min-height:280px;border:1px solid #aab9cc;border-radius:8px;padding:14px;font:15px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;color:#162840}
    .progress{font-size:15px;color:#395875;margin:0 0 12px}.error{border-color:#c64646!important;background:#fff8f8!important}
    @media(max-width:550px){main{padding:20px 12px 65px}.panel,.question{padding:18px}.actions button{width:100%}}
  </style>
</head>
<body><main>
  <h1>インテック式適性診断</h1>
  <p class="lead">お名前と64タイプを入力し、各設問で最も近い回答を選択してください。最後に回答番号の一覧をコピーできます。</p>
  <form id="form" novalidate>
    <section class="panel" aria-labelledby="basicHeading"><h2 id="basicHeading">基本情報</h2>
      <div class="field"><label for="name">お名前</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="furigana">ふりがな</label><input id="furigana" name="furigana" autocomplete="off" required></div>
      <div class="field"><label for="type">64タイプ（英字コード）</label><select id="type" name="type" required><option value="">選択してください</option></select></div>
      <p class="hint">64タイプは100問版の診断結果に表示された英字コードを選んでください。</p>
    </section>
    <p class="progress" id="progress" aria-live="polite">回答済み 0 / 20問</p>
    <div id="questions"></div>
    <div class="actions"><button class="primary" type="submit">回答一覧を表示</button></div>
    <p id="message" role="alert"></p>
  </form>
  <section class="panel" id="resultPanel" hidden aria-labelledby="resultHeading">
    <h2 id="resultHeading">回答一覧</h2>
    <p class="hint">ここには点数を表示しません。選択した番号を確認してコピーしてください。</p>
    <textarea id="result" readonly aria-label="コピーする回答一覧"></textarea>
    <div class="actions"><button class="primary" type="button" id="copy">採点をコピー</button><button class="secondary" type="button" id="back">回答を修正する</button></div>
    <p id="copyMessage" role="status" aria-live="polite"></p>
  </section>
  <p class="hint">64タイプ診断：<a href="https://64personalities-lifepath.com/" target="_blank" rel="noopener noreferrer">診断サイトを開く</a></p>
</main>
<script>
const questions=[{"number": 1, "title": "買い物中、目当ての商品が見つかりません。どうしますか？", "choices": [{"number": 1, "text": "すぐに店員へ聞く"}, {"number": 2, "text": "もう少し自分で探してから店員へ聞く"}, {"number": 3, "text": "案内表示などを確認し、できるだけ自分で探す"}, {"number": 4, "text": "時間がかかっても、店員には聞かず自力で探す"}, {"number": 5, "text": "違うお店に行ってみる"}]}, {"number": 2, "title": "道で人が倒れました。どうしますか？", "choices": [{"number": 1, "text": "迷わず蘇生を試み、周りの人にも指示を出す"}, {"number": 2, "text": "スマホで動画を撮っておく"}, {"number": 3, "text": "指示を出している人に協力する"}, {"number": 4, "text": "119番に電話し、状況を伝えて指示を仰ぐ"}, {"number": 5, "text": "たぶん実際には気が動転して、何もできない"}]}, {"number": 3, "title": "初めて行く場所への集合時間が決まりました。どうしますか？", "choices": [{"number": 1, "text": "前日に道順と所要時間を調べる"}, {"number": 2, "text": "当日の朝に調べる"}, {"number": 3, "text": "早めに出て、道中で確認する"}, {"number": 4, "text": "時間どおり着くつもりで、着いてから状況に合わせる"}, {"number": 5, "text": "一緒に行く人に行き方を聞く"}]}, {"number": 4, "title": "友人と出かける予定でしたが、当日雨が降っています。どうしますか？", "choices": [{"number": 1, "text": "予定どおり出かける"}, {"number": 2, "text": "行き先を屋内に変える案を出す"}, {"number": 3, "text": "友人がどうしたいか先に聞く"}, {"number": 4, "text": "別の日にしようと提案する"}, {"number": 5, "text": "雨でも楽しめることをその場で探す"}]}, {"number": 5, "title": "説明書を見ながら組み立てていたら、途中で部品が一つ余りました。どうしますか？", "choices": [{"number": 1, "text": "最初から手順を確認し直す"}, {"number": 2, "text": "余った部品の用途だけ調べる"}, {"number": 3, "text": "完成品を見て、問題がなさそうならそのままにする"}, {"number": 4, "text": "詳しい人に聞く"}, {"number": 5, "text": "いったん使ってみて、不具合があれば確認する"}]}, {"number": 6, "title": "友人におすすめしたお店が、思ったほど気に入ってもらえなかったようです。どうしますか？", "choices": [{"number": 1, "text": "好みは人それぞれなので、特に何もしない"}, {"number": 2, "text": "どのあたりが合わなかったか聞いてみる"}, {"number": 3, "text": "別のお店を提案する"}, {"number": 4, "text": "自分のおすすめが合わなかったことを謝る"}, {"number": 5, "text": "次におすすめするときのために、相手の好みを覚えておく"}]}, {"number": 7, "title": "欲しかった商品を買った翌日、別のお店でもっと安く売っているのを見つけました。どう思いますか？", "choices": [{"number": 1, "text": "買った時点では納得していたので気にしない"}, {"number": 2, "text": "少し悔しいが、すぐに気持ちを切り替える"}, {"number": 3, "text": "次からは複数のお店を比較しようと思う"}, {"number": 4, "text": "差額や返品条件を確認する"}, {"number": 5, "text": "しばらくそのことが気になってしまう"}]}, {"number": 8, "title": "楽しみにしていた予定がある日に、親しい人から「少し話を聞いてほしい」と連絡が来ました。どうしますか？", "choices": [{"number": 1, "text": "何があったか確認し、急ぎなら予定を変更する"}, {"number": 2, "text": "今は短時間だけ話を聞き、後で改めて連絡する"}, {"number": 3, "text": "予定が終わってから、落ち着いて話を聞く"}, {"number": 4, "text": "今日は難しいと伝え、別の日を提案する"}, {"number": 5, "text": "今日は無理だと伝えて、謝る"}]}, {"number": 9, "title": "以前、ある人が「これ、探しているんだよね」と話していたものを、偶然お店で見つけました。どうしますか？", "choices": [{"number": 1, "text": "その場で写真を撮って、見つけたことを連絡する"}, {"number": 2, "text": "必要かどうか連絡して確認する"}, {"number": 3, "text": "買って、次に会ったとき渡す"}, {"number": 4, "text": "次に会ったとき、どこで見つけたか教える"}, {"number": 5, "text": "特に何もしない"}]}, {"number": 10, "title": "自分の作業を進めているとき、上司から「今、確認してほしいことがある」と連絡が来ました。どうしますか？", "choices": [{"number": 1, "text": "手を止めて、すぐ確認する"}, {"number": 2, "text": "何の確認か聞いて、急ぎかどうか判断する"}, {"number": 3, "text": "今の作業を一区切りさせてから確認する"}, {"number": 4, "text": "対応できる人がほかにいないか確認する"}, {"number": 5, "text": "自分なりに優先順位をつけて、いつ確認するか決める"}]}, {"number": 11, "title": "先輩が作成した書類にミスを発見した。どうしますか？", "choices": [{"number": 1, "text": "その場で伝える"}, {"number": 2, "text": "こっそり先輩にだけ伝える"}, {"number": 3, "text": "修正後先輩にこっそり修正したことを伝える"}, {"number": 4, "text": "修正するけど誰にも言わない"}, {"number": 5, "text": "先輩に合ってるか確認をする"}]}, {"number": 12, "title": "どうしても行きたかった推しのイベントの抽選に外れました。どうしますか？", "choices": [{"number": 1, "text": "次の抽選や別の入手方法を調べる"}, {"number": 2, "text": "似たような別のイベントを探す"}, {"number": 3, "text": "いっそのこと別の予定を入れる"}, {"number": 4, "text": "今回は縁がなかったと思い、普段どおり過ごす"}, {"number": 5, "text": "あらゆる人脈を駆使してチケットを譲ってもらう"}]}, {"number": 13, "title": "時間をかけて考えた提案が採用されませんでした。次にどうしますか？", "choices": [{"number": 1, "text": "採用されなかった理由を聞き、提案を練り直す"}, {"number": 2, "text": "別の案を考えて提案する"}, {"number": 3, "text": "ほかの人に案を見てもらい、意見を聞く"}, {"number": 4, "text": "今回の案は残しておき、別の仕事に取りかかる"}, {"number": 5, "text": "ショックなので、いったん気分転換する"}]}, {"number": 14, "title": "営業をしていてだいぶ喋ってから奥様に「夫にきかないと～」と言われた。どうしますか？", "choices": [{"number": 1, "text": "ですよね！と諦める"}, {"number": 2, "text": "旦那様の帰宅時間を伺う"}, {"number": 3, "text": "あとでキャンセルできるからとりあえず申し込もうと押す"}, {"number": 4, "text": "ですよね！けど今ならこのキャンペーンやってますよ！と提案する"}, {"number": 5, "text": "やってられん、休憩しよう"}]}, {"number": 15, "title": "ご年配の方に飲み物をだす。どうしますか？", "choices": [{"number": 1, "text": "迷わず熱い緑茶"}, {"number": 2, "text": "お茶だけど季節によっては冷たい麦茶"}, {"number": 3, "text": "あえてのコーヒー"}, {"number": 4, "text": "ご希望を伺う"}, {"number": 5, "text": "いつか使うかもしれないとドリンクメニュー表を作っておいた"}]}, {"number": 16, "title": "仕事でミスをしてしまった。どうしますか？", "choices": [{"number": 1, "text": "上司にすぐ報告する"}, {"number": 2, "text": "原因を調べる"}, {"number": 3, "text": "すぐにやり直す"}, {"number": 4, "text": "同僚に相談する"}, {"number": 5, "text": "落ち込む"}]}, {"number": 17, "title": "お客様に説明したところ、「ちょっとよく分からない」と言われました。どうしますか？", "choices": [{"number": 1, "text": "どの部分が分からなかったか聞く"}, {"number": 2, "text": "最初から、もっと簡単な言葉で説明し直す"}, {"number": 3, "text": "具体例を使って説明する"}, {"number": 4, "text": "資料を見せながら説明する"}, {"number": 5, "text": "次もこういうことあるかもと資料作成を決意する"}]}, {"number": 18, "title": "新人から、以前説明したことをもう一度質問されました。どうしますか？", "choices": [{"number": 1, "text": "前と同じように、もう一度説明する"}, {"number": 2, "text": "実際に一緒にやってみる"}, {"number": 3, "text": "どこで分からなくなったか聞く"}, {"number": 4, "text": "なぜこうするのか理由はなんだったのか聞く"}, {"number": 5, "text": "研修動画を撮影するのを手伝ってもらう"}]}, {"number": 19, "title": "仕事の進め方について、チーム内で意見が分かれました。どうしますか？", "choices": [{"number": 1, "text": "自分の考えと理由を伝える"}, {"number": 2, "text": "それぞれの考えを聞いて、共通点を探す"}, {"number": 3, "text": "実際に試してから決めることを提案する"}, {"number": 4, "text": "上司に判断してもらう"}, {"number": 5, "text": "ほかの人の意見に合わせる"}]}, {"number": 20, "title": "あなたが仕事で行き詰まったとき、最も陥りやすい状態はどれですか？", "choices": [{"number": 1, "text": "周囲のアドバイスを聞き入れず、自分のやり方に固執してしまう"}, {"number": 2, "text": "慎重になりすぎて決断が遅れ、チャンスを逃してしまう"}, {"number": 3, "text": "批判を恐れて自分の意見を引っ込め、他人に合わせてしまう"}, {"number": 4, "text": "複数のタスクを同時に抱え込み、どれも中途半端になってしまう"}, {"number": 5, "text": "完璧を求めるあまり、予定の期限ギリギリまで提出を遅らせてしまう"}]}];
const typeNames={"ENTJ-AC": "衆を率いる戦略家", "ENTJ-AS": "絶対的支配者", "ENTJ-TC": "承認を求めるリーダー", "ENTJ-TS": "孤独な暴君", "ENTP-AC": "協創のアイデアマン", "ENTP-AS": "孤高の論客", "ENTP-TC": "愛されたい発明家", "ENTP-TS": "自己破壊的な皮肉屋", "INTJ-AC": "合意を形成する設計者", "INTJ-AS": "孤高のグランドデザイナー", "INTJ-TC": "完璧を求める苦悩の戦略家", "INTJ-TS": "真理を探究する孤独な賢者", "INTP-AC": "親しみやすい分析家", "INTP-AS": "真理を解剖する探究者", "INTP-TC": "承認を求める発明家", "INTP-TS": "思考の迷宮に住まう者", "ENFJ-AC": "人々を照らす太陽", "ENFJ-AS": "信念の指導者", "ENFJ-TC": "葛藤する理想のメンター", "ENFJ-TS": "孤高の救済者", "ENFP-AC": "きらめくアイデアの伝道師", "ENFP-AS": "自由なる精神の探求者", "ENFP-TC": "人々の可能性を信じるチアリーダー", "ENFP-TS": "魂の自由を叫ぶ表現者", "INFJ-AC": "調和を紡ぐ理想家", "INFJ-AS": "信念を貫く洞察者", "INFJ-TC": "献身的な調停者", "INFJ-TS": "内省する探求者", "INFP-AC": "共感を育む夢想家", "INFP-AS": "信念を貫く詩人", "INFP-TC": "繊細な心の調停者", "INFP-TS": "内宇宙の探求者", "ESFJ-AC": "みんなを繋ぐ社交家", "ESFJ-AS": "信念のお節介焼き", "ESFJ-TC": "愛されたい人気者", "ESFJ-TS": "信念を貫く世話役", "ESTJ-AC": "公明正大なコミュニティリーダー", "ESTJ-AS": "断固たる法の執行者", "ESTJ-TC": "責任感の強いまとめ役", "ESTJ-TS": "孤高の現場監督", "ISFJ-AC": "慈愛に満ちた守護者", "ISFJ-AS": "信念を貫く守り手", "ISFJ-TC": "報われたい献身家", "ISFJ-TS": "傷ついた守護者", "ISTJ-AC": "信頼される組織の守り手", "ISTJ-AS": "孤高の番人", "ISTJ-TC": "献身的な縁の下の力持ち", "ISTJ-TS": "頑固な職人", "ESFP-AC": "みんなのハッピーメイカー", "ESFP-AS": "自由を愛するエンターテイナー", "ESFP-TC": "愛されたいムードメーカー", "ESFP-TS": "個性派パフォーマー", "ESTP-AC": "スリルを共有するエンターテイナー", "ESTP-AS": "規格外の勝負師", "ESTP-TC": "人好きのするトラブルメーカー", "ESTP-TS": "一匹狼の勝負請負人", "ISFP-AC": "自由な感性のハーモニー奏者", "ISFP-AS": "マイウェイを行くアーティスト", "ISFP-TC": "繊細な心を持つ表現者", "ISFP-TS": "魂の色彩を探す旅人", "ISTP-AC": "頼れる実践的サポーター", "ISTP-AS": "孤高のトラブルシューター", "ISTP-TC": "繊細な技術屋", "ISTP-TS": "秘めたる技の探究者"};
const bases=['ENFJ','ENFP','ENTJ','ENTP','ESFJ','ESFP','ESTJ','ESTP','INFJ','INFP','INTJ','INTP','ISFJ','ISFP','ISTJ','ISTP'];
const suffixes=['AC','AS','TC','TS'];
const typeSelect=document.getElementById('type');
for(const base of bases){const group=document.createElement('optgroup');group.label=base;for(const suffix of suffixes){const code=`${base}-${suffix}`;group.append(new Option(`${code}｜${typeNames[code]}`,code))}typeSelect.append(group)}
const container=document.getElementById('questions');
for(const item of questions){
  const box=document.createElement('section');box.className='question';box.id=`q${item.number}`;
  const label=document.createElement('label');label.htmlFor=`answer${item.number}`;
  const badge=document.createElement('span');badge.className='num';badge.textContent=`問${item.number}`;
  label.append(badge,document.createTextNode(item.title));
  const select=document.createElement('select');select.id=`answer${item.number}`;select.name=`answer${item.number}`;select.required=true;
  select.append(new Option('選択してください',''));
  for(const choice of item.choices)select.append(new Option(`${choice.number}．${choice.text}`,String(choice.number)));
  box.append(label,select);container.append(box);
}
const form=document.getElementById('form');
const selectors=questions.map(item=>document.getElementById(`answer${item.number}`));
function updateProgress(){document.getElementById('progress').textContent=`回答済み ${selectors.filter(s=>s.value).length} / 20問`}
form.addEventListener('change',e=>{if(e.target.matches('select'))updateProgress();e.target.classList.remove('error');document.getElementById('message').textContent='' });
form.addEventListener('input',e=>{e.target.classList.remove('error');document.getElementById('message').textContent='' });
form.addEventListener('submit',e=>{
  e.preventDefault();
  const fields=[document.getElementById('name'),document.getElementById('furigana'),typeSelect,...selectors];
  const missing=fields.find(field=>!field.value.trim());
  if(missing){missing.classList.add('error');document.getElementById('message').textContent=missing.id.startsWith('answer')?`問${missing.id.slice(6)}を選択してください。`:`${missing.labels[0].textContent}を入力・選択してください。`;missing.scrollIntoView({behavior:'smooth',block:'center'});missing.focus({preventScroll:true});return}
  const lines=[`お名前：${document.getElementById('name').value.trim()}`,`ふりがな：${document.getElementById('furigana').value.trim()}`,`64タイプ：${typeSelect.value}`,'','インテック式 回答'];
  for(let i=0;i<20;i++)lines.push(`${i+1}-${selectors[i].value}`);
  const resultPanel=document.getElementById('resultPanel');document.getElementById('result').value=lines.join('\n');resultPanel.hidden=false;
  document.getElementById('copyMessage').textContent='';resultPanel.scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('copy').addEventListener('click',async()=>{
  const result=document.getElementById('result');const message=document.getElementById('copyMessage');
  try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(result.value);
    else{result.focus();result.select();if(!document.execCommand('copy'))throw Error('copy failed')}
    message.textContent='コピーしました。';
  }catch{result.focus();result.select();message.textContent='自動コピーできませんでした。選択された文章を手動でコピーしてください。'}
});
document.getElementById('back').addEventListener('click',()=>{document.getElementById('resultPanel').hidden=true;form.scrollIntoView({behavior:'smooth'})});
</script></body></html>
